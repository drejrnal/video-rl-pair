[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-rl-pair"
version = "0.1.0"
description = "Readable video representation learning with smooth temporal alignment"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "safetensors>=0.4,<1",
  "hydra-core==1.3.2",
  "pydantic>=2,<3",
  "typing-extensions>=4.12",
  "av>=14,<17",
  "pillow>=10,<13",
]

[project.scripts]
video-rl-pair = "video_rl_pair.train:main"
video-rl-pair-evaluate = "video_rl_pair.evaluate:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "basedpyright>=1.21", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_rl_pair = ["conf/*.yaml", "conf/*/*.yaml", "assets/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# Formatter conflicts and conventions used by mathematical/PyTorch modules.
ignore = ["COM812", "ISC001", "D203", "D213", "FBT001", "FBT002", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D", "INP001"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
include = ["src"]
